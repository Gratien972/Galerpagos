<style>
:root{--card:#15383e;--tx:#f6efd8;--ac:#f2b134;--bd:#33706f;--sand:#ecd9a0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--g,linear-gradient(100deg,#b9a678,#79c3cc 32%,#1c8fae 68%,#0d4f63)) fixed;transition:background 1s;touch-action:manipulation;overscroll-behavior:none}

#app{max-width:520px;margin:0 auto;padding:46px 14px 30px;position:relative;z-index:1}
.in{animation:in .55s ease}@keyframes in{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
h1{font:700 2.1rem Georgia,serif;text-align:center;margin:.3em 0;text-shadow:0 2px 8px #000a}h2{font-family:Georgia,serif;margin:.4em 0;text-shadow:0 2px 6px #000a}h3{margin:1em 0 .4em;color:#ffd878;font-family:Georgia,serif;text-shadow:0 2px 6px #000c}
.card{background:linear-gradient(#1a444b,var(--card));border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0;box-shadow:0 4px 14px #0006}
button,input,select{font:inherit;font-size:16px;border-radius:12px;border:1px solid var(--bd);padding:11px 12px;background:var(--card);color:var(--tx);min-height:44px}
button{cursor:pointer}button:active{transform:scale(.97)}button:disabled{opacity:.45;cursor:not-allowed}

${c.b=='epa'?`<p>🃏 +${n=='Voyageur temporel'?'2 cartes (discrètes)':'1 carte'} en fin de tour.</p>`:c.b?`<p style="font-size:.85rem;opacity:.8">${c.b=='bois'?'Bois récolté':'Ajouté aux réserves de l’île'} en fin de tour.</p>`:''}
<h3>3. 🎒 Inventaire</h3><div class=inv>${rows.map(([k,e,l])=>`<div class=iv><span>${e} ${l}</span><span><button onclick="inv('${k}',-1)">−</button> <b>${p.inv[k]}</b> <button onclick="inv('${k}',1)">+</button></span></div>`).join('')}</div>
<label><input type=checkbox style="width:auto;min-height:0" ${p.poison?'checked':''} onchange="setPz(this.checked)"> ☠️ Empoisonné</label>${p.poison?`<button class=alt onclick="antidote()">💉 Antidote</button>`:''}
<h3>4. Capacité</h3>${capH(p,c,oth)}
<h3>5. 🔁 Échanger</h3>${xchH(p,c,oth)}
${kh}`;
if(lock)A.innerHTML=`<div class=lk>${H}<div class=cv><div class=cvi><div class="big-e ${p.a?'sn':'sk'}">${p.a?'🐍':'💀'}</div><h2>${p.a?'Tu es empoisonné':'Tu es mort'}</h2><p>${p.a?'Le poison te paralyse pendant ce seul tour : tu ne peux rien faire, sauf utiliser l’antidote. Il se dissipe à la fin du tour.':'Tu ne peux plus rien faire.'}</p></div></div></div>${p.a?`<button class=big onclick="antidote()">💉 Antidote</button>`:''}<button class=big onclick="endTurn()">➡️ Passer au joueur suivant</button>`;
else A.innerHTML=H+`<button class=big ${busy?'disabled':''} onclick="endTurn()">✅ Fin du tour</button>`;
if(S.msg&&S.msg!==S.lastMsg){S.lastMsg=S.msg;const mm=A.querySelector('.msg');mm&&mm.scrollIntoView({block:'center'})}
if(fr!=null)requestAnimationFrame(()=>requestAnimationFrame(()=>{const f=$('f'+fr);f&&f.classList.add('gone')}))}
function pick(k){if(lk()||(k=='eau'&&S.w=='e0'))return;S.cur.b=k;S.cur.dbl=false;S.cur.q=k=='eau'?wq():1;sfx(k);ui()}
function qty(d){S.cur.q=Math.max(1,S.cur.q+d);ui()}
function inv(k,d){if(lk())return;const p=S.p[S.i];p.inv[k]=Math.max(0,p.inv[k]+d);ui()}
function mode(m){if(lk())return;S.mode=S.mode==m?null:m;ui()}
function cell(i){const c=S.cur,p=S.p[S.i];if(!c||lk())return;
if(S.mode=='ser'&&!S.seen[i]&&ok(i)){S.map[i]='ser';c.cap=true;S.mode=null;S.msg='🐍 Serpent placé en secret.';sfx('snake');ui()}
else if(S.mode=='insp'&&!S.seen[i]){const k=S.map[i];p.u.insp=1;S.mode=null;S.msg=`🔍 Tu inspectes la case : ${T[k][0]} <b>${T[k][1]}</b><br><small>Elle n’est pas révélée aux autres.</small>`;sfx('reveal');ui()}
else if(S.mode=='exp'&&!c.ex&&!S.seen[i]&&ok(i)){const k=S.map[i],n=rn(p);let m=T[k][1],ex='',x2='';
if(k=='arm'){p.inv.fusil++;ex=' (ajouté à ton inventaire)'}if(k=='mun'){p.inv.balle++;ex=' (ajouté à ton inventaire)'}if(k=='deb'){p.inv.tole++;ex=' (ajouté à ton inventaire)'}
if(k=='vil')p.hand=Math.max(0,p.hand-1);
if(k=='ser'){p.poison=true;p.pn=true;p.ep=true;S.pz=true}
if(n=='Capitaine'){if(Math.random()<1/8){p.key=true;x2+='<br>🎡 Roue : <b>🔑 Clé de communication obtenue !</b>'}else x2+='<br>🎡 Roue : 🍂 feuilles inutiles'}
if(n=='Pêcheur au gros'&&shore(i)){S.fish++;S.st.fish++;p.st.fish++;x2+='<br>🎣 Case au bord de l’eau : <b>+1 poisson</b>'}
if(k=='com')x2+='<br>📡 L’antenne du centre de communication reste visible de tous sur la carte.';S.seen[i]=true;S.fresh=i;p.st.expl++;c.ex=true;S.mode=null;S.msg=`${T[k][0]} <b>${m}${ex}</b>${x2}<br><small>${k=='com'?'Ce message disparaît à la fin de ton tour, mais l’antenne reste sur la carte.':'Seul toi le vois : ça disparaît à la fin de ton tour.'}</small>`;sfx('reveal');ui()}}
function kill(){if(lk())return;const p=me(),v=S.p[+$('k').value];if(!v)return;if(p.inv.fusil<1||p.inv.balle<1){S.kmsg='🔫 Impossible de tirer : il te manque '+(p.inv.fusil<1?'un fusil':'')+(p.inv.fusil<1&&p.inv.balle<1?' et ':'')+(p.inv.balle<1?'une balle':'')+' dans ton inventaire.';return ui()}S.kmsg='';p.inv.balle--;v.sh=true;S.shot=+$('k').value;sfx('shot');ui()}
function defend(){const v=S.p[S.shot],d=S.p[+$('df').value];if(!d||d.inv.tole<1)return;d.inv.tole--;S.shot=null;S.msg=`🛡️ ${d.n} défend ${v.n} et perd 1 tôle : <b>${v.n} survit !</b>`;sfx('shield');ui()}
function noDef(){const v=S.p[S.shot],p=me();S.inh=S.shot;S.shot=null;v.a=false;v.dt=S.tour;S.st.kills++;p.st.kills++;S.msg=`💀 ${v.n} est mort.`;sfx('kill');ui()}
function takeM(y){const v=S.p[S.inh],p=me();S.inh=null;if(y&&rn(p)!='Survivaliste'){p.ex.push({n:v.n,rn:rn(v)});S.msg=`💀 ${v.n} est mort. Tu récupères sa mission (${rn(v)}).`}else S.msg=`💀 ${v.n} est mort. Tu gardes uniquement ta mission.`;ui()}
function endTurn(){if(S.shot!=null||S.inh!=null)return;const c=S.cur,p=S.p[S.i];
if(!locked(p)){if(c.b&&c.b!='epa'){const q=eq(c);S.st[c.b]+=q;p.st[c.b]+=q;if(c.b=='fish')S.fish+=q;if(c.b=='eau')S.eau+=q;if(c.dbl){if(rn(p)=='Psychorigide')p.u.psy=1;if(rn(p)=='Sourcier')p.f.dbl=(p.f.dbl||0)+1}}if(c.b=='epa'){p.st.epa++;p.hand+=rn(p)=='Voyageur temporel'?2:1}}
p.st.turns++;if(p.poison&&!p.pn)p.poison=false;p.pn=false;S.msg='';let w=0;
do{S.i++;if(S.i>=S.p.length){S.i=0;w=1}}while(!S.p[S.i].a);
if(w){if(S.storm)return fin();return roundEnd()}trans()}
function eat(){const n=S.p.filter(q=>q.a).length,mf=Math.max(0,n-S.fish),me2=Math.max(0,n-S.eau);S.fish=Math.max(0,S.fish-n);S.eau=Math.max(0,S.eau-n);
S.news=(S.vnote||'')+`🍽️ Fin du tour ${S.tour} : −${n} 🐟 et −${n} 💧 consommés.`+(mf||me2?`<br>⚠️ Pénurie : il manquait ${mf?mf+' 🐟':''}${mf&&me2?' et ':''}${me2?me2+' 💧':''} !`:'')}
function antidote(){const p=S.p[S.i];if(!p.a)return;p.poison=false;p.pn=false;sfx('reveal');ui()}
/* ===== Pénurie : vote ===== */
function need(){const c=S.p.filter(q=>q.a).length;return Math.max(0,c-S.fish,c-S.eau)}
function roundEnd(){const d=need(),f=S.force,al=S.p.filter(q=>q.a).length;S.force=false;if(d>0||(f&&al>=2))return vote(d,f);eat();S.vnote='';S.tour++;nextW();S.i=S.p.findIndex(q=>q.a);trans()}
function vote(d,f){const v=S.p.map((q,i)=>i).filter(i=>S.p[i].a);
if(v.length<2){S.starved+=v.length;S.p.forEach(q=>{if(q.a){q.a=false;q.dt=S.tour}});return scr(`<div class=c><h1>☠️ Famine</h1><p>Il n’y a plus assez à manger ni à boire : plus personne ne survit.</p></div><button class=big onclick="fin()">Voir la fin de partie</button>`)}
S.vt={n:d,v,k:0,t:{},f:!!f};vtrans()}
function vtrans(){const v=S.vt,p=S.p[v.v[v.k]];sfx('weather');
scr(`<div class=c><h1>${v.n>0?'⚠️ Pénurie':'🗳️ Vote d’élimination'}</h1><div class=stk><div class=w>🐟 <b>${S.fish}</b> en stock</div><div class=w>💧 <b>${S.eau}</b> en stock</div></div><div class=msg>${v.f?'Un joueur a forcé un vote d’élimination.<br>':''}${v.n>0?`Il faut éliminer <b>au moins ${v.n}</b> joueur${v.n>1?'s':''} pour que les vivres ne passent pas en négatif.`:'Un joueur sera éliminé.'}</div><p>🗳️ Vote secret ${v.k+1}/${v.v.length}</p><p>Passe le téléphone à</p><h2 style="font-size:2rem">${p.n}</h2></div><button class=big onclick="vui()">Je suis ${p.n}</button>`)}
function vui(){const v=S.vt,me=v.v[v.k];scr(`<h2>🗳️ ${S.p[me].n}, vote</h2><p>Qui doit être éliminé ?</p><select id=vs style="width:100%">${v.v.filter(i=>i!=me).map(i=>`<option value=${i}>${S.p[i].n}</option>`).join('')}</select><button class=big onclick="vcast()">🗳️ Voter</button>`)}
function vcast(){const v=S.vt,i=+$('vs').value;v.t[i]=(v.t[i]||0)+1;v.k++;if(v.k<v.v.length)vtrans();else vres()}
function vres(){const v=S.vt,o=sh(v.v.slice()).sort((a,b)=>(v.t[b]||0)-(v.t[a]||0)),dead=[];
for(const i of o){if(need()<=0&&(!v.f||dead.length>=1))break;S.p[i].a=false;S.p[i].dt=S.tour;dead.push(i)}
if(v.n>0)S.starved+=dead.length;
S.vnote=`⚖️ Vote : ${dead.map(i=>S.p[i].n).join(', ')} éliminé${dead.length>1?'s':''}.<br>`;sfx('kill');
scr(`<h1 class=c>⚖️ Résultat du vote</h1><div class=card>${v.v.map(i=>`<div class=s><span>${dead.includes(i)?'💀':'🟢'} ${S.p[i].n}</span><b>${v.t[i]||0} vote${(v.t[i]||0)>1?'s':''}</b></div>`).join('')}</div><p class=c>${dead.map(i=>S.p[i].n).join(', ')} ${dead.length>1?'sont éliminés':'est éliminé'} (égalité : tirage au sort).</p><button class=big onclick="vdone()">Continuer</button>`)}
function vdone(){S.vt=null;if(!S.p.some(q=>q.a))return fin();roundEnd()}
function fin(q){stopW();document.body.dataset.w='';if(!q)sfx('end');scr(`<div class=c><h1>🏝️ Fin de partie</h1><p>${S.tour} tour${S.tour>1?'s':''} joué${S.tour>1?'s':''}</p></div><h3>Joueurs</h3>${S.p.map((p,i)=>`<div class=card><div class=hero style="align-items:center"><img class=av style="width:84px" src="${IMG[R[p.r].i]}" alt=""><div><b>${p.n}</b><br><small>${R[p.r].n} · ${p.a?'🟢 en vie':'💀 mort'}</small><br><small>📌 ${ml(p,R[p.r].n)}</small></div></div><button class="alt sm" onclick="stat(${i})">📊 Statistiques</button></div>`).join('')}<button class=big onclick="welcome()">Rejouer</button>`)}
function stat(i){const p=S.p[i],r=R[p.r],t=p.st;scr(`<h2 class=c>📊 ${p.n}</h2><div class=card><div class=hero><img class=av src="${IMG[r.i]}" alt=""><div><b>${r.n}</b><p>${p.a?'🟢 En vie':'💀 Mort au tour '+p.dt}</p><p>🎯 ${r.m}</p><p>📌 ${ml(p,r.n)}</p></div></div></div><div class=card>${[['🎣 Poissons pêchés',t.fish],['💧 Eau récoltée',t.eau],['🪵 Bois récolté',t.bois],['🚢 Fouilles d’épave',t.epa],['🧭 Cases explorées',t.expl],['💀 Joueurs tués',t.kills],['🔄 Tours joués',t.turns]].map(([l,v])=>`<div class=s><span>${l}</span><b>${v}</b></div>`).join('')}</div><button class=big onclick="fin(1)">← Retour aux joueurs</button>`)}
icon();welcome();
</script></body></html>
